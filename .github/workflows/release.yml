name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The version PR is merged: tag it once. The tag triggers the tarball workflow, which creates the GitHub release.
      - name: Tag release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          v="v$(node -p "require('./apps/server/package.json').version")"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "$v already tagged"; exit 0; fi
          git tag "$v" && git push origin "$v"
