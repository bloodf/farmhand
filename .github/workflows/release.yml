name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1.9.0
        with:
          version: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The version PR is merged: tag once, then build the tarball and publish the GitHub release here.
      # A tag pushed with GITHUB_TOKEN never triggers another workflow, so this job does both.
      - name: Tag release
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          v="v$(node -p "require('./apps/server/package.json').version")"
          git fetch --tags --quiet
          git rev-parse -q --verify "refs/tags/$v" >/dev/null || { git tag "$v" && git push origin "$v"; }
          if gh release view "$v" >/dev/null 2>&1; then echo "$v already released"; else echo "tag=$v" >>"$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.tag != ''
        run: pnpm bundle
      - if: steps.tag.outputs.tag != ''
        run: gh release create "${{ steps.tag.outputs.tag }}" dist/farmhand-*.tar.gz --title "${{ steps.tag.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
