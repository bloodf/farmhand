# Optional: keep Spoolman's data in an existing PostgreSQL server instead of
# SQLite. Set the SPOOLMAN_DB_* values in .env, then point the helper at both
# files (helper.env): COMPOSE_FILE=/opt/farmhand/deploy/compose/docker-compose.yml:/opt/farmhand/deploy/compose/docker-compose.postgres.yml
services:
  spoolman:
    environment:
      SPOOLMAN_DB_TYPE: postgres
      SPOOLMAN_DB_HOST: ${SPOOLMAN_DB_HOST:?set SPOOLMAN_DB_HOST in .env}
      SPOOLMAN_DB_PORT: ${SPOOLMAN_DB_PORT:-5432}
      SPOOLMAN_DB_NAME: ${SPOOLMAN_DB_NAME:-spoolman}
      SPOOLMAN_DB_USERNAME: ${SPOOLMAN_DB_USERNAME:-spoolman}
      SPOOLMAN_DB_PASSWORD: ${SPOOLMAN_DB_PASSWORD:?set SPOOLMAN_DB_PASSWORD in .env}
